name: uni-shrimp

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uni-shrimp-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8002}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uni-shrimp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app

networks:
  app:
  database:
    external: true
    name: uni-services_backend
