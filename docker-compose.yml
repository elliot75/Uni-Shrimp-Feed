services:
  backend:
    build:
      context: ./backend
    container_name: uni-shrimp-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: uni-shrimp-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
